<!DOCTYPE html>

<style>
  :root {
    --desk: #E2E8EF; --paper: #F9FBFD; --grid: #B7CDE3; --margin: #E06D75;
    --ink-x: #1E3F9C; --ink-o: #C0392B; --text: #22303F; --muted: #586676; --edge: #C9D4E0;
    --hand: "Kalam", "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
    --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #0F151D; --paper: #18212D; --grid: #2D3E53; --margin: #94444D;
      --ink-x: #86A9FF; --ink-o: #FF8576; --text: #E2E8F0; --muted: #9AA8B8; --edge: #2A3647;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #0F151D; --paper: #18212D; --grid: #2D3E53; --margin: #94444D;
    --ink-x: #86A9FF; --ink-o: #FF8576; --text: #E2E8F0; --muted: #9AA8B8; --edge: #2A3647;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--sans); font-size: 1rem; line-height: 1.5; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 48px; }
  .lang { display: flex; gap: .35rem; margin: 0 0 1.2rem; }
  .lang-btn {
    font: .85rem var(--sans); padding: .25rem .7rem; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--edge); background: var(--paper); color: var(--muted);
  }
  .lang-btn[aria-pressed="true"] { border-color: var(--ink-x); color: var(--ink-x); font-weight: 700; }
  .lang-btn:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; }
  h1 {
    font-family: var(--hand); font-weight: 700; color: var(--ink-x);
    font-size: clamp(3rem, 10vw, 4.6rem); line-height: 1; margin: 0 0 .4rem;
    transform: rotate(-2deg); transform-origin: left center;
  }
  .lead { margin: 0 0 2rem; color: var(--muted); max-width: 46ch; font-size: 1.05rem; }

  .games { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
  .game {
    display: grid; gap: .5rem; align-content: start;
    color: inherit; text-decoration: none; border-radius: 14px; padding: 4px;
  }
  .game:focus-visible { outline: 3px solid var(--ink-x); outline-offset: 6px; }
  .pic { display: block; width: 100%; height: auto; transition: transform .15s ease; }
  .game:hover .pic, .game:focus-visible .pic { transform: rotate(-1.2deg) translateY(-3px); }
  .game h2 { font-family: var(--hand); font-size: 2.1rem; line-height: 1.1; margin: .6rem 0 0; color: var(--ink-x); }
  .game p { margin: 0; color: var(--muted); max-width: 40ch; }
  .play {
    justify-self: start; margin-top: .5rem;
    font: 700 1rem var(--sans); padding: .6rem 1.1rem; border-radius: 8px;
    background: var(--ink-x); color: var(--paper);
  }
  .tip { margin: 2.6rem 0 0; color: var(--muted); font-size: .9rem; max-width: 60ch; }
  @media (prefers-reduced-motion: reduce) { .pic { transition: none; } }
</style>
</head>

<script>
(function () {
  const T = {
    en: {
      title: "Games", lead: "Pick a game. They’re free, work on phones and computers, and you can play against the computer or invite someone.",
      amobaText: "Five in a row on graph paper. Play the computer, someone next to you, or invite someone online.",
      ktName: "Codebreaker", ktText: "Crack the hidden color code on the classic brown board. Play the computer, or invite someone and take turns hiding the code.",
      play: "Play",
      tip: "Tip: open your browser’s menu and choose “Add to Home Screen” to keep this page one tap away."
    },
    hu: {
      title: "Játékok", lead: "Válassz egy játékot! Ingyenesek, telefonon és számítógépen is működnek, és játszhatsz a gép ellen, vagy meghívhatsz valakit.",
      amobaText: "Ötöt egy sorba, kockás papíron. Játszhatsz a gép ellen, valakivel magad mellett, vagy meghívhatsz valakit online.",
      ktName: "Kódtörő", ktText: "Fejtsd meg a rejtett színkódot a jól ismert barna táblán. Játszhatsz a gép ellen, vagy meghívhatsz valakit, és felváltva rejtitek el a kódot.",
      play: "Játék",
      tip: "Tipp: a böngésző menüjében válaszd a „Hozzáadás a kezdőképernyőhöz” lehetőséget, és ez az oldal egy koppintásra lesz."
    }
  };
  const KEY = "amoba-lang";   // shared with the games, so everyone's language choice carries over
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  function detect() {
    const s = lsGet(KEY);
    if (s === "en" || s === "hu") return s;
    const first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    return /^hu\b/i.test(first) ? "hu" : "en";
  }
  let lang = detect();
  function apply() {
    document.documentElement.lang = lang;
    document.title = T[lang].title;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
    document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }
  document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; lsSet(KEY, lang); apply(); }));
  apply();
})();
</script>
